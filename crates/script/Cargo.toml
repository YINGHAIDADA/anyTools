[package]
name = "anytools-script"
description = "Embedded JS/TS script runtime (QuickJS) for anyTools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anytools-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rquickjs = { version = "0.14", features = ["loader"] }
oxc = { version = "0.157", features = ["transformer", "codegen", "semantic"] }
sha2 = "0.11"
ureq = "3"

[dev-dependencies]
anytools-platform.workspace = true
tempfile.workspace = true
serde_yaml_ng.workspace = true
