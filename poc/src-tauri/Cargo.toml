[package]
name = "anytools-poc"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
core-foundation = "0.10"
trash = "5"

[profile.dev]
# keep debug builds responsive enough to measure latency honestly
opt-level = 1

[profile.release]
opt-level = 3
