<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>anyTools overlay</title>
    <link rel="stylesheet" href="/src/overlay.css" />
  </head>
  <body>
    <div id="stage">
      <div id="glow-css" class="glow">
        <div class="glow-ring"></div>
        <div class="glow-ring glow-bloom"></div>

      <canvas id="glow-gl" class="glow" width="840" height="840"></canvas>

      <div id="center">
        <div id="center-icon"></div>
        <div id="center-label"></div>
        <div id="center-hint"></div>
      </div>
    </div>
    <script type="module" src="/src/overlay.js"></script>
  </body>
</html>
